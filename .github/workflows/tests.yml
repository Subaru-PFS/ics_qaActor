name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Just ruff, not the [dev] extra: linting needs none of the git
      # dependencies, and skipping them turns a couple of minutes of cloning into
      # a few seconds. Pinned so a ruff release cannot fail an unrelated PR —
      # bump it deliberately, in step with the `dev` extra in pyproject.toml.
      - name: Install ruff
        run: python -m pip install ruff==0.16.8

      - name: Lint
        run: ruff check --output-format=github

      # Runs even if `ruff check` failed, so one push reports both.
      - name: Check formatting
        if: always()
        run: ruff format --check

  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      # Full history: lsst-versions derives the version from git tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # ics-utils pulls in pfs-tron-actorcore (actorcore/opscore), which the tests
      # import, plus pfs_instdata and pfs_utils. All of these are public git deps,
      # so the install clones a few repos and takes a couple of minutes.
      # The suite itself runs offline: conftest stubs `eups`, no EUPS setup needed.
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
